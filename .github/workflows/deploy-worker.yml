name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
    paths:
      - worker.js
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV: ${{ secrets.CLOUDFLARE_LEADERBOARD_KV_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$CF_KV" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_LEADERBOARD_KV_ID in repository Actions secrets."
            exit 1
          fi
      - name: Prepare Worker configuration
        env:
          CF_KV: ${{ secrets.CLOUDFLARE_LEADERBOARD_KV_ID }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const id = process.env.CF_KV;
          if (!/^[a-f0-9]{32}$/i.test(id)) {
            console.error('::error::CLOUDFLARE_LEADERBOARD_KV_ID must be a 32-character hex namespace ID');
            process.exit(1);
          }
          const config = {
            name: 'chlopcy-quiz-ai',
            main: 'worker.js',
            compatibility_date: '2026-09-01',
            workers_dev: true,
            keep_vars: true,
            ai: { binding: 'AI' },
            kv_namespaces: [{ binding: 'LEADERBOARD', id }]
          };
          fs.writeFileSync('wrangler.json', JSON.stringify(config, null, 2));
          NODE
      - name: Deploy existing Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.json
