<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Egipt, Izrael, pismo — quiz klasa 5</title><style>:root{font-family:system-ui,sans-serif;color:#152944;background:#f3f8ff}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:780px;margin:auto}h1{font-size:clamp(28px,5vw,42px)}.panel{background:white;border:1px solid #cbdcf0;border-top:5px solid #176ac0;padding:24px;border-radius:8px;box-shadow:3px 4px #dbe7f4;margin:20px 0}.answers{display:grid;gap:12px;margin:22px 0}button{font:inherit;cursor:pointer;border:2px solid #176ac0;border-radius:6px;background:#fff;color:#152944;padding:14px;text-align:left;min-height:52px}button:focus-visible{outline:3px solid #d9a500}button:disabled{cursor:default}button.correct{background:#dcf7e8;border-color:#146345}button.wrong{background:#ffe3e3;border-color:#ae3030}.primary{background:#176ac0;color:white;font-weight:700}.secondary{border-color:#777}#feedback{font-weight:700;min-height:24px}#hint{background:#fff8df;padding:12px;border-radius:6px;margin-top:12px}a{color:#176ac0}small{color:#52647a}@media(max-width:600px){body{padding:12px}.panel{padding:18px}}</style></head><body><main><p><a href="../">← Wszystkie quizy</a></p><h1>🏺 Egipt, Izrael, pismo</h1><p>Historia • klasa 5 • 10 pytań w sesji • odpowiedzi A–D</p><section class="panel"><div id="game"><label for="nick">Pseudonim (opcjonalnie)</label><input id="nick" maxlength="24" style="display:block;width:100%;padding:12px;font:inherit;margin:12px 0" placeholder="Uczeń"><button class="primary" id="start">Rozpocznij quiz</button></div></section><small>Podpowiedzi pomagają przypomnieć sobie materiał. Wynik pozostaje na tym urządzeniu i nie jest wysyłany na serwer.</small></main><script>const BANK=[{"id":1,"q":"Jak nazywała się rzeka, nad którą rozwinął się starożytny Egipt?","a":["Nil","Tygrys","Eufrat","Jordan"],"correct":0,"hint":"Coroczne wylewy tej rzeki użyźniały pola Egipcjan."},{"id":2,"q":"Jak nazywano władcę starożytnego Egiptu?","a":["Cesarz","Faraon","Konsul","Król polis"],"correct":1,"hint":"Uważano go za pośrednika między bogami a ludźmi."},{"id":3,"q":"Do czego służyły piramidy egipskie?","a":["Jako targowiska","Jako szkoły","Jako grobowce władców","Jako porty"],"correct":2,"hint":"Wiązały się z wiarą w życie po śmierci."},{"id":4,"q":"Jak nazywało się pismo obrazkowe starożytnych Egipcjan?","a":["Alfabet łaciński","Hieroglify","Cyrylica","Pismo klinowe"],"correct":1,"hint":"Znaki mogły przedstawiać ludzi, zwierzęta i przedmioty."},{"id":5,"q":"Na czym często pisali starożytni Egipcjanie?","a":["Na papirusie","Na plastiku","Na pergaminie drukowanym","Na papierze gazetowym"],"correct":0,"hint":"Materiał powstawał z rośliny rosnącej nad Nilem."},{"id":6,"q":"Który bóg Egipcjan był związany ze światem zmarłych?","a":["Zeus","Ozyrys","Posejdon","Mars"],"correct":1,"hint":"Według wierzeń sądził dusze zmarłych."},{"id":7,"q":"Czym była mumifikacja?","a":["Sposobem budowy domów","Metodą liczenia","Zabezpieczaniem ciała zmarłego","Rodzajem podatku"],"correct":2,"hint":"Miała pomóc zachować ciało na życie pozagrobowe."},{"id":8,"q":"Co pomagało Egipcjanom uprawiać ziemię?","a":["Wylewy Nilu i kanały nawadniające","Stały śnieg","Wulkaniczne erupcje","Woda morska"],"correct":0,"hint":"Rolnictwo zależało od wody doprowadzanej na pola."},{"id":9,"q":"Kto w Egipcie zajmował się zapisywaniem dokumentów?","a":["Skryba","Gladiator","Legionista","Senator"],"correct":0,"hint":"Umiejętność pisania dawała mu ważną pozycję."},{"id":10,"q":"Jak nazywa się słynny kamień pomocny w odczytaniu hieroglifów?","a":["Kamień z Rosetty","Kamień z Gizy","Kamień z Krety","Kamień z Synaju"],"correct":0,"hint":"Zawierał ten sam tekst w kilku zapisach."},{"id":11,"q":"Jak nazywano krainę, w której żyli starożytni Izraelici?","a":["Galia","Kanaan","Babilonia","Italia"],"correct":1,"hint":"Była położona na wschodnim wybrzeżu Morza Śródziemnego."},{"id":12,"q":"Jak nazywała się święta księga judaizmu w szerszym znaczeniu?","a":["Biblia hebrajska","Iliada","Eneida","Koran"],"correct":0,"hint":"Zawiera między innymi Torę."},{"id":13,"q":"Jak nazywa się wiara w jednego Boga?","a":["Politeizm","Animizm","Monoteizm","Ateizm"],"correct":2,"hint":"Przeciwieństwo wielobóstwa."},{"id":14,"q":"Kto według tradycji wyprowadził Izraelitów z Egiptu?","a":["Dawid","Mojżesz","Salomon","Herod"],"correct":1,"hint":"Jest związany z otrzymaniem Dekalogu."},{"id":15,"q":"Jak nazywa się zbiór dziesięciu przykazań?","a":["Kodeks Hammurabiego","Dekalog","Edykt mediolański","Prawo XII tablic"],"correct":1,"hint":"Według Biblii Mojżesz otrzymał je na Synaju."},{"id":16,"q":"Który król według Biblii zbudował świątynię w Jerozolimie?","a":["Salomon","Saul","Tutanchamon","Cyrus"],"correct":0,"hint":"Był synem króla Dawida."},{"id":17,"q":"Jak nazywa się dzień odpoczynku i świętowania w judaizmie?","a":["Niedziela","Szabat","Ramadan","Wielkanoc"],"correct":1,"hint":"Trwa od piątkowego wieczoru do sobotniego wieczoru."},{"id":18,"q":"Które miasto stało się ważnym centrum religijnym Izraelitów?","a":["Ateny","Rzym","Jerozolima","Memfis"],"correct":2,"hint":"Znajdowała się tam świątynia."},{"id":19,"q":"Co oznacza diaspora?","a":["Rozproszenie ludności poza ojczyzną","Podział roku","Budowę świątyni","Rodzaj pisma"],"correct":0,"hint":"Dotyczy życia społeczności w wielu krajach."},{"id":20,"q":"Jak nazywa się żydowski dom modlitwy?","a":["Synagoga","Piramida","Akropol","Forum"],"correct":0,"hint":"Odbywają się w nim modlitwy i czytanie Tory."},{"id":21,"q":"Jak nazywa się pismo używające znaków w kształcie klinów?","a":["Hieroglificzne","Klinowe","Łacińskie","Runiczne"],"correct":1,"hint":"Znaki odciskano rylcem w glinie."},{"id":22,"q":"Kto posługiwał się pismem klinowym w Mezopotamii?","a":["Sumerowie","Wikingowie","Rzymianie","Inkowie"],"correct":0,"hint":"Jedna z najstarszych cywilizacji między Tygrysem a Eufratem."},{"id":23,"q":"Jaki materiał służył często do pisania w Mezopotamii?","a":["Tabliczki gliniane","Szklane płyty","Liście palmowe drukowane","Blacha stalowa"],"correct":0,"hint":"Miękki materiał można było odciskać rylcem."},{"id":24,"q":"Co było ważnym osiągnięciem Fenicjan?","a":["Rozwój alfabetu spółgłoskowego","Wynalezienie druku","Stworzenie cyfr rzymskich","Wynalezienie internetu"],"correct":0,"hint":"Uprościli zapis za pomocą niewielu znaków."},{"id":25,"q":"Dlaczego wynalezienie pisma było przełomowe?","a":["Umożliwiło zapisywanie informacji","Zakończyło wszystkie wojny","Zastąpiło rolnictwo","Spowodowało zanik handlu"],"correct":0,"hint":"Pozwalało przekazywać wiadomości następnym pokoleniom."},{"id":26,"q":"Jaką rolę pełnili skrybowie?","a":["Zapisywali dokumenty i prowadzili rachunki","Dowodzili flotą","Budowali wyłącznie drogi","Uprawiali wyłącznie ziemię"],"correct":0,"hint":"Ich praca wymagała znajomości znaków."},{"id":27,"q":"Co oznacza pojęcie alfabet?","a":["Zbiór znaków pisma w ustalonej kolejności","Zbiór świątyń","Rodzaj piramidy","Rodzaj kalendarza"],"correct":0,"hint":"Każda litera może oznaczać określony dźwięk."},{"id":28,"q":"Które pismo wiąże się ze starożytnym Egiptem?","a":["Hieroglify","Cyrylica","Hangul","Pismo gotyckie"],"correct":0,"hint":"Można je zobaczyć na ścianach egipskich świątyń."},{"id":29,"q":"Który wynalazek ułatwił Egipcjanom tworzenie zwojów?","a":["Papirus","Kompas","Proch","Maszyna parowa"],"correct":0,"hint":"To materiał do pisania wykonany z rośliny."},{"id":30,"q":"Co badacze nazywają źródłem pisanym?","a":["Dawny dokument lub inskrypcję","Każdy kamień","Wyłącznie kość zwierzęcia","Każdą roślinę"],"correct":0,"hint":"Zawiera utrwalony tekst."}];const game=document.getElementById('game');let session=[],index=0,score=0,answered=false;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function start(){const sets=[BANK.slice(0,10),BANK.slice(10,20),BANK.slice(20,30)];session=sets.flatMap(a=>a.sort(()=>Math.random()-.5).slice(0,3));session.push(BANK[Math.floor(Math.random()*10)]);session=session.sort(()=>Math.random()-.5);index=0;score=0;render()}function render(){answered=false;if(index>=session.length){game.innerHTML='<h2>Koniec quizu!</h2><p>Twój wynik: <strong>'+score+' / '+session.length+'</strong></p><button class="primary" id="again">Nowa sesja</button>';document.getElementById('again').onclick=start;return}const q=session[index];game.innerHTML='<small>Pytanie '+(index+1)+' z '+session.length+' • wynik '+score+'</small><h2>'+escapeHtml(q.q)+'</h2><div class="answers">'+q.a.map((a,i)=>'<button class="answer" data-choice="'+i+'">'+String.fromCharCode(65+i)+'. '+escapeHtml(a)+'</button>').join('')+'</div><button class="secondary" id="showHint">💡 Podpowiedź</button><div id="hint" hidden></div><p id="feedback" role="status" aria-live="polite"></p><button class="primary" id="next" hidden> Następne pytanie →</button>';document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));document.getElementById('showHint').onclick=()=>{const h=document.getElementById('hint');h.textContent=q.hint;h.hidden=false};document.getElementById('next').onclick=()=>{index++;render();window.scrollTo({top:0,behavior:'auto'})}}function choose(choice){if(answered)return;answered=true;const q=session[index];if(choice===q.correct)score++;document.querySelectorAll('.answer').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});document.getElementById('feedback').textContent=choice===q.correct?'Dobrze!':'Poprawna odpowiedź: '+q.a[q.correct];document.getElementById('next').hidden=false}document.getElementById('start').onclick=start;</script></body></html>
